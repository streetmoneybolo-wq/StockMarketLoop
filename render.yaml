services:
  - type: web
    name: stockmarketloop-loop-kick
    runtime: node
    plan: starter
    region: ohio
    rootDir: loop-kick
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm rebuild better-sqlite3 && pnpm build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: LOOP_KICK_DB_PATH
        value: /var/data/loop-kick.sqlite
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SML_PUSH_SECRET
        sync: false
      - key: SML_SITE_URL
        value: https://stockmarketloop.com
    disk:
      name: loop-kick-data
      mountPath: /var/data
      sizeGB: 1
